<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookCycle Works | Free Book Pickup Dayton Ohio</title>
  <meta name="google-site-verification" content="fKX_iAuabT6LitVKPHATtFmR-mYi3dx6COTEdtaa7ro" />
  <meta name="description" content="Free book pickup service in Dayton, Ohio.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .hero-bg { background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('https://picsum.photos/id/1015/2000/1200') center/cover no-repeat; }
    .section { scroll-margin-top: 80px; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Navbar, Hero, Quick Info, How It Works sections unchanged... -->

  <!-- Schedule Form -->
  <section id="schedule" class="py-16 bg-gray-100 section">
    <div class="max-w-2xl mx-auto px-6">
      <h1 class="text-4xl font-bold text-center mb-2">Schedule Your Free Pickup</h1>
      <p class="text-center text-emerald-600 mb-10">Dayton, Ohio • Nationwide for large collections</p>

      <form action="https://api.web3forms.com/submit" method="POST" id="pickupForm" class="bg-white shadow-xl rounded-3xl p-8 space-y-8">
        <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY_HERE">
        <input type="hidden" name="subject" value="New Book Pickup Request - Dayton">
        <input type="hidden" name="from_name" value="BookCycle Works">

        <!-- Sends SMS to your phone -->
        <input type="hidden" name="email" value="3266880972@txt.att.net">

        <!-- Rest of form -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Full Name</label>
            <input type="text" name="name" required class="w-full border border-gray-300 rounded-2xl px-4 py-3 focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Phone</label>
            <input type="tel" name="phone" required class="w-full border border-gray-300 rounded-2xl px-4 py-3 focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <!-- Other fields (email, address, etc.) stay the same as before -->

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-5 rounded-3xl text-xl font-semibold transition">
          Submit Free Pickup Request
        </button>
      </form>

      <div id="successMessage" class="hidden mt-8 bg-emerald-100 border border-emerald-300 rounded-3xl p-8 text-center">
        <i class="fas fa-check-circle text-emerald-600 text-6xl mb-4"></i>
        <h3 class="text-3xl font-bold text-emerald-800">Request Received!</h3>
        <p class="text-emerald-700 mt-3">Thank you! We'll text you soon.</p>
      </div>
    </div>
  </section>

  <!-- Footer and Script -->
  <footer class="bg-emerald-900 text-white py-12 text-center">
    <p class="text-sm">© 2026 BookCycle Works • Dayton, Ohio</p>
    <p class="text-xs mt-2">Call <a href="tel:326-688-0972" class="underline">326-688-0972</a></p>
  </footer>

  <script>
    document.getElementById('pickupForm').addEventListener('submit', function(e) {
      setTimeout(() => {
        document.getElementById('pickupForm').classList.add('hidden');
        document.getElementById('successMessage').classList.remove('hidden');
      }, 800);
    });
  </script>
</body>
</html>
